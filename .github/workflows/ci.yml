name: ci

on:
  push:
    paths:
      - "**.c"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  pull_request:

# avoid wasted runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true



jobs:

  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
    - &checkout
       uses: actions/checkout@v7

    - name: Static build
      run: cmake --workflow default

    - name: Shared build
      run: cmake --workflow shared


  int64:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - *checkout

    - name: Int64 build
      run: cmake --workflow int64


  msvc:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
    - *checkout

    - name: MSVC build
      run: cmake --workflow msvc
